<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} NoTitle {% endblock title %}</title>
</head>
<body>
    <style>
        * {
            box-sizing: border-box;
        }
        .btn {
            border: none;
            cursor: pointer;
            padding: 7px 20px;
            border-radius: 5px;
            margin: 5px;
        }

        .header {
            margin-bottom: 20px;
        }
        .header__nav {
            display:flex;
        }

        .header__nav a, .header__nav button {
            display: flex;
            width: 100px;
            height: 45px;
            border-width: 1px 0px 1px 1px;
            border-color: grey;
            border-style: solid;
            text-decoration: none;
            font-weight: 900;
            background-color: white;

            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .header__nav a:visited {
            color: black;
        }

        .header__nav a:hover, .header__nav button:hover {
            background-color: rgb(201, 255, 237);
        }

        .header__nav a:first-child, .header__nav button:first-child {
            border-radius: 5px 0 0 5px;
        }

        .header__nav a:last-child, .header__nav button:last-child {
            border-width: 1px;
            border-radius: 0 5px 5px 0;
        }

        .cart {
                width: 100%;
                /* border: 1px solid black; */
            }

        .cart__items {
            display: flex;
            flex-direction: column;
            margin: 20px;
        }

        .cart__product {
            border: 1px solid rgb(170, 170, 170);
            display: flex;
            height: 50px;
            width: 900px;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
        }

        .cart__product-action {
            display: flex;
        }

        .message-info {
            background-color: greenyellow;
            color: black;
            padding: 10px;
            list-style: none;
        }
    </style>

    <div class="header">
        <div class="header__nav">
            <a href="{% url 'products:list' %}">Главная</a>
            <a href="{% url 'cart:cart' %}">Корзина</a>
            <a href="{% url 'orders:list' %}">Мои заказы</a>

            {% if user.is_authenticated %} 
                <form action="{% url 'users:logout' %}" method="post">{% csrf_token %} <button type="submit">Выход</button></form>
            {% else %} 
                <a href="{% url 'users:signin' %}">Вход</a>
                <a href="{% url 'users:signup' %}">Регистрация</a>
            {% endif %}
        </div>
    </div>

    <div class="cart__items-amount" style="margin-bottom: 30px;">
        <b>Items in cart:</b> {{cart|length}}
        <div>
            {% if messages %}
                {% for msg in messages %}
                    <li{% if msg.tags %} class="message-{{ msg.tags }}"{% endif %}>{{ msg }}</li>
                {% endfor %}
            {% endif %}
        </div>
    </div>
    {% block content %} {% endblock content %}
</body>
</html>
