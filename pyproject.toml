[project]
name = "online-shop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django-mptt>=0.16.0",
    "django>=5.1.7",
    "pillow>=11.1.0",
    "psycopg[binary]>=3.2.7",
    "pydantic-settings>=2.9.1",
    "python-slugify>=8.0.4",
    "requests>=2.32.3",
    "stripe>=12.0.0",
    "uuid7>=0.1.0",
]

[project.optional-dependencies]
test = [
    "faker>=37.1.0",
    "pytest-asyncio>=0.26.0",
    "pytest-django>=4.10.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "online_shop.config.settings"
addopts = ["-s", "-v"]
